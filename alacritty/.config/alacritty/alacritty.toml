[cursor]
style = { shape = "Block", blinking = "Never" }
vi_mode_style = { shape = "Block", blinking = "Never" }

[font]
size = 13.5
normal = { family = "Fira Code", style = "Regular" }

[general]
import = ["~/.config/alacritty/themes/catppuccin/mocha.toml"]

[scrolling]
history = 50000

[selection]
save_to_clipboard = true

[terminal]
osc52 = "CopyPaste"

[window]
padding = { x = 8, y = 8 }
