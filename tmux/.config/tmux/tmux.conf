set -sg terminal-overrides ",*:RGB"  # true color support
set -g escape-time 0  # disable delays on escape sequences
set -g repeat-time 1000  # increase "prefix-free" window

# leader key
unbind C-b
set -g prefix `
bind ` send-prefix
set -g prefix2 ^
bind ^ send-prefix -2

# options
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mode-keys vi
set -g mouse on

# status style
set -g status-position top
set -g status-justify absolute-centre
set -g status-style "bg=default"
set -g status-right ""
set -g status-left "#S"

# pane style
set -g pane-active-border-style "fg=blue"
set -g window-status-current-style "fg=blue bold"

# reload config
unbind r
bind r source-file "~/.config/tmux/tmux.conf" \; display "Reloaded!"

# open new window in current dir
bind c new-window -c "#{pane_current_path}"

# navigate panes
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# resize active pane
bind -r H resize-pane -L
bind -r J resize-pane -D
bind -r K resize-pane -U
bind -r L resize-pane -R

# fullscreen active pane
bind f resize-pane -Z

# toggle between current and last used window
bind b select-window -l
